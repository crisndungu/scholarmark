<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://js.paystack.co https://checkout.paystack.com https://paystack.com https://js.clerk.com 'unsafe-inline' 'unsafe-eval'; script-src-attr 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com https://paystack.com https://checkout.paystack.com https://js.clerk.com 'unsafe-inline'; style-src-elem 'self' https://fonts.googleapis.com https://paystack.com https://checkout.paystack.com https://js.clerk.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com https://paystack.com; connect-src 'self' https://api.paystack.co https://checkout.paystack.com https://paystack.com https://scholarmark.onrender.com https://scholarmark.vercel.app https://clerk.com https://*.clerk.accounts.dev; frame-src https://checkout.paystack.com https://paystack.com https://clerk.com https://*.clerk.accounts.dev; img-src 'self' data: https://checkout.paystack.com https://paystack.com https://img.clerk.com; object-src 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScholarMark — User Portal</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --oxford: #002147; --gold: #c5a059; --bg: #f8fafc; }
    body { background: var(--bg); font-family: 'Outfit', sans-serif; color: var(--oxford); }
    .portal-nav { background: white; border-bottom: 1px solid #e2e8f0; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .portal-logo { font-family: 'EB Garamond', serif; font-size: 1.5rem; font-weight: 600; text-decoration: none; color: var(--oxford); }
    .portal-container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .dashboard-grid { display: grid; gap: 1.5rem; }
    .doc-card { background: white; border-radius: 12px; padding: 1.5rem; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; transition: transform 0.2s; }
    .doc-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    .doc-info h3 { margin-bottom: 0.25rem; font-size: 1.1rem; }
    .doc-meta { font-size: 0.85rem; color: #64748b; display: flex; gap: 1rem; }
    .status-pill { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .status-paid { background: #dcfce7; color: #166534; }
    .status-reviewed { background: #eff6ff; color: #1e40af; }
    .status-failed { background: #fee2e2; color: #991b1b; }
    .btn-view { background: var(--oxford); color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer; transition: opacity 0.2s; }
    .btn-view:hover { opacity: 0.9; }
    .empty-state { text-align: center; padding: 4rem 2rem; }
    .skeleton { background: #e2e8f0; height: 100px; border-radius: 12px; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  </style>
</head>
<body>
  <nav class="portal-nav">
    <a href="/" class="portal-logo">Scholar<em>Mark</em></a>
    <div id="user-button"></div>
  </nav>

  <div class="portal-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1 style="font-family: 'EB Garamond', serif; margin: 0;">Your Academic History</h1>
        <a href="/#submit" class="btn-view" style="text-decoration: none;">+ New Submission</a>
    </div>
    
    <div id="dashboard-content" class="dashboard-grid">
      <!-- Loading Skeletons -->
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </div>

  <!-- Clerk SDK -->
  <script src="/js/config.js" defer></script>
  <!-- Clerk SDK will be loaded dynamically by portal.js -->
  <script src="/js/portal.js" defer></script>
</body>
</html>
